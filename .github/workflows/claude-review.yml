name: Claude Review

# Every pull request gets a check named claude-review on its head commit, which branch protection on main waits for.
#
# Ours (a branch of this repo, opened by the owner, or by github-actions[bot] on a claude/issue-* branch that
# claude-issue.yml made from the owner's issue) gets the full review. It first waits for this commit's CI (runner
# minutes only), then Claude reviews the change against .github/claude-review.md with CI's results and the log of
# each failed job in hand. It edits nothing: each problem is posted as an inline comment on its line, with a
# one-click GitHub suggestion where the fix is a local replacement. The check fails while problems remain; a new
# push reviews again.
#
# Not ours (a fork, claude/outside-*, a pr-N branch from claude.yml, Dependabot): not reviewed here. claude-tldr.yml
# summarises forks, and these merge only on the owner's word. The check passes so the owner can still merge them.
#
# Escape hatch: when the review cannot run (usage limit, outage) and a fix is urgent, add the review-skipped label.
# While the PR carries it, this check passes with a notice instead of reviewing. Only collaborators can label, so only
# the owner or the session can use it. Removing the label runs a full review. Any other label change reuses the
# verdict already posted for the head commit.
#
# Usage: a draft, or a change of only images, media, fonts or lockfiles, passes without a review. Opus reviews only
# a change of 300+ lines or one touching the wire format; the rest is Sonnet.
#
# Claude sees the PR title, body and the owner's comments only, pre-fetched into .review/pr.md. It has Read, Grep and
# Glob only: no shell, no gh, no edits, and is denied the runner's secrets folders and .git config.
#
# Run it by hand: gh workflow run claude-review.yml --ref <pr-branch> -f pr=<number>

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (run on its head branch)
        required: true
        type: string

# A change of some other label waits for the review in progress instead of cancelling it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || github.event.label.name == 'review-skipped' }}

# Read-only on code: nothing here pushes. Actions read is for the failed jobs' logs.
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  checks: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Find the pull request and decide what to do (no AI in this step)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "::error::pr must be a pull request number."; exit 1 ;; esac
          f() { jq -r "$1" "$RUNNER_TEMP/pr.json"; }
          for try in 1 2 3 4 5 6; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
            # A dispatched run's check lands on the commit it was dispatched at, so that must be the PR's head.
            # Just after a push GitHub can take a moment to move the PR's head; ask again.
            [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$(f .head.sha)" = "$SHA" ] && break
            sleep 10
          done
          head_ref=$(f .head.ref)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && { [ "$GITHUB_REF_NAME" != "$head_ref" ] || [ "$(f .head.sha)" != "$SHA" ]; }; then
            echo "::error::Dispatched at a commit that is not the head of PR #$PR; dispatch it on the PR's branch."; exit 1
          fi
          head_repo=$(f '.head.repo.full_name // ""')
          author=$(f .user.login)
          ours=false
          if [ "$head_repo" = "$GITHUB_REPOSITORY" ]; then
            case "$head_ref" in
              claude/outside-*) ;;
              claude/issue-*) if [ "$author" = "$OWNER" ] || [ "$author" = "github-actions[bot]" ]; then ours=true; fi ;;
              *) if [ "$author" = "$OWNER" ]; then ours=true; fi ;;
            esac
          fi
          # Images, video, fonts and lockfiles only: nothing for a reviewer to read. (Lockfiles are Dependabot's.)
          assets_only=false
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/files.txt" &&
            [ -s "$RUNNER_TEMP/files.txt" ] &&
            ! grep -Eiv '\.(png|jpe?g|gif|webp|ico|icns|mp4|webm|mov|mp3|wav|ttf|otf|woff2?)$|(^|/)(package-lock\.json|gradle\.lockfile)$' "$RUNNER_TEMP/files.txt" > /dev/null; then
            assets_only=true
          fi
          if [ "$(f .state)" != open ]; then mode=closed
          elif [ "$(f 'any(.labels[]; .name == "review-skipped")')" = true ]; then mode=skipped
          # A draft is still moving; marking it ready for review starts the full review.
          elif [ "$(f .draft)" = true ]; then mode=draft
          elif [ "$assets_only" = true ]; then mode=assets
          elif [ "$ours" != true ]; then mode=not-ours
          elif { [ "$ACTION" = labeled ] || [ "$ACTION" = unlabeled ]; } && [ "$LABEL" != review-skipped ]; then mode=reuse
          else mode=review
          fi
          {
            echo "mode=$mode"
            echo "number=$PR"
            echo "sha=$SHA"
            echo "head_ref=$head_ref"
            echo "base_ref=$(f .base.ref)"
          } >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - name: Pass without a review
        if: contains(fromJSON('["skipped","not-ours","closed","draft","assets"]'), steps.pr.outputs.mode)
        env:
          MODE: ${{ steps.pr.outputs.mode }}
        run: |
          case "$MODE" in
            skipped) echo "::notice::review-skipped label: passing without a Claude review. Remove the label to review." ;;
            not-ours) echo "::notice::Not reviewed here: summarised by claude-tldr.yml if it is a fork, merged only on the owner's word." ;;
            closed) echo "::notice::The pull request is closed." ;;
            draft) echo "::notice::Draft: not reviewed yet. Marking it ready for review starts the review." ;;
            assets) echo "::notice::Only images, media, fonts or lockfiles changed: nothing to review." ;;
          esac

      - name: Reuse the verdict posted for this commit (no AI in this step)
        if: steps.pr.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-review -->"))) | .id' | head -n1)
          # Line 2 is written by the post step, never by Claude.
          if [ -n "$id" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body | sed -n 2p | tr -d '\r')" = "<!-- claude-review: pass $SHA -->" ]; then
            echo "This commit already passed the review."
          else
            echo "::error::No passing review for this commit; re-run the review (remove and re-add a label, or dispatch it)."; exit 1
          fi

      - name: Check out the PR's head commit
        if: steps.pr.outputs.mode == 'review'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the model and fetch the PR's text (no AI in this step)
        if: steps.pr.outputs.mode == 'review'
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          g() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.pager=cat "$@"; }
          g fetch -q origin "$BASE_REF"
          # To keep the owner's Max usage light, Opus reads only a big or wire-format change; the rest is Sonnet.
          lines=$(g diff --numstat "origin/$BASE_REF...HEAD" | awk '$1 != "-" { t += $1 + $2 } END { print t + 0 }')
          if [ "$lines" -ge 300 ] || ! g diff --quiet "origin/$BASE_REF...HEAD" -- protocol docs/PROTOCOL.md; then
            model=claude-opus-5-5
          else
            model=claude-sonnet-5-5
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Changed lines: $lines, model: $model"
          mkdir -p .review
          printf '.review/\n.claude-pr/\n' >> .git/info/exclude
          # Claude gets no git at all (git diff --output= could write .git/config). It reads these files instead.
          g diff --stat "origin/$BASE_REF...HEAD" > .review/stat.txt
          g diff "origin/$BASE_REF...HEAD" > .review/diff.patch
          g log --format='%h %s' "origin/$BASE_REF..HEAD" > .review/log.txt
          # Title, body and the owner's comments only: anyone can comment on a public PR.
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,comments \
            | jq -r --arg o "$OWNER" '"# " + .title + "\n\n" + (.body // "") + "\n\n## Comments by the owner\n"
                + ([.comments[] | select(.author.login == $o) | "\n---\n" + .body] | join(""))' > .review/pr.md

      - name: Wait for CI on this commit and collect what failed (no AI in this step)
        if: steps.pr.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          # The review reads CI's results instead of guessing at them, so it waits here first. This loop costs
          # runner minutes only, no Claude usage. ci-ok is ci.yml's final gate; until it exists, CI has not been
          # queued yet (just after a push, or when claude-issue.yml dispatches both on a new branch).
          checks() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --paginate \
              | jq -s '[.[].check_runs[] | select(.name != "claude-review")] | group_by(.name) | map(max_by(.id))'
          }
          deadline=$((SECONDS + 3000))
          waited=true
          while :; do
            checks > "$RUNNER_TEMP/checks.json" || echo '[]' > "$RUNNER_TEMP/checks.json"
            if jq -e 'any(.[]; .name == "ci-ok") and all(.[]; .status == "completed")' "$RUNNER_TEMP/checks.json" > /dev/null; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::CI had not finished after 50 minutes; reviewing without its results."
              waited=false
              break
            fi
            sleep 30
          done
          {
            echo "# CI on this commit"
            [ "$waited" = true ] || echo "CI had not finished after 50 minutes; these results are partial."
            jq -r '.[] | "- \(.name): \(.conclusion // .status)"' "$RUNNER_TEMP/checks.json"
          } > .review/ci.md
          # The tail of each failed Actions job's log, which is where the error is. Others (Vercel) link out.
          jq -r '.[] | select((.conclusion // "") | IN("success","skipped","neutral","") | not)
            | [.name, (.details_url // "")] | @tsv' "$RUNNER_TEMP/checks.json" |
          while IFS=$'\t' read -r name url; do
            job=$(printf '%s' "$url" | sed -n 's#.*/actions/runs/[0-9]*/job/\([0-9]*\).*#\1#p')
            [ -n "$job" ] || continue
            [ "$name" = ci-ok ] && continue
            printf '\n## %s (failed): last 120 log lines\n\n```\n' "$name"
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" 2>/dev/null | tail -n 120 | cut -c1-400 || true
            printf '```\n'
          done | head -c 60000 >> .review/ci.md
          cat .review/ci.md | head -n 40


      - name: Claude reviews and suggests fixes
        if: steps.pr.outputs.mode == 'review'
        id: claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # GITHUB_TOKEN, not the Claude app's token: the action revokes the app's token when it ends, and nothing
          # here needs it. No id-token permission is needed either.
          github_token: ${{ github.token }}
          # A dispatched run's actor, and the author of a claude/issue-* PR, is github-actions[bot].
          allowed_bots: 'github-actions'
          # Claude runs no command and edits nothing here (it reads prepared files). Left on, this would swap files
          # of a bot-authored PR for main's, and Claude would review the wrong code.
          restrict_untrusted_prs: 'false'
          prompt: |
            Review pull request ${{ github.repository }}#${{ steps.pr.outputs.number }} (branch
            ${{ steps.pr.outputs.head_ref }} into ${{ steps.pr.outputs.base_ref }}). First read
            .github/claude-review.md and follow it.

            .review/pr.md holds the PR's title, description and the owner's comments. The change is in
            .review/diff.patch, with .review/stat.txt (files and line counts) and .review/log.txt (its commits).
            .review/ci.md holds this commit's CI results, with the log tail of each failed job. If a check
            failed, find why. A failure this change caused is a real problem like any other. A failure this
            change could not have caused (an outage, a flaky runner), say so and do not count it against the
            verdict.
            Read stat.txt first; on a very large change, read the riskiest files fully and sample the rest, and
            say so. Read surrounding code in the checkout, not only the diff: a bug is often in what the change
            forgot to update.

            You edit nothing. You suggest: the owner applies fixes with one click from your inline comments.
            Give your result as the structured output:
            - verdict: "pass" if no real problem was found, otherwise "fail".
            - summary: a short TL;DR for the owner: what the PR does, what you found, what is left. Plain words,
              under 250 words, markdown. Do not repeat each finding in full; they are posted on their lines.
            - findings: one per real problem, at most 15, most severe first. Each has path (repo-relative), line
              (a line number in the new version of the file, and inside one of the diff's + or context lines,
              or GitHub cannot attach it), optional start_line (for a fix over several lines, the first line;
              line is then the last), body (the problem and why, in a sentence or two), and optional suggestion
              (the exact replacement text for lines start_line..line, or line alone, with indentation kept, and
              no code fence). Leave suggestion out when the fix is not a local replacement; say what to do in
              body instead.
          claude_args: >-
            --model ${{ steps.rounds.outputs.model }}
            --max-turns 80
            --permission-mode default
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Read(//proc/**),Read(//tmp/**),Read(//etc/**),Read(//run/**),Read(//home/runner/work/_temp/**),Read(//home/runner/.*/**),Read(./.git/config),Read(**/.env*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"start_line":{"type":"integer"},"body":{"type":"string"},"suggestion":{"type":"string"}},"required":["path","line","body"]}}},"required":["verdict","summary","findings"]}'

      - name: Check and post the review (no AI in this step)
        if: steps.pr.outputs.mode == 'review' && steps.claude.outputs.structured_output != ''
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          printf '%s' "$OUTPUT" > .review/output.json
          verdict=$(jq -r '.verdict // ""' .review/output.json)
          [ "$verdict" = pass ] || verdict=fail
          jq -r '.summary // ""' .review/output.json | head -c 6000 > .review/summary.md
          # Each finding as a review comment; a suggestion becomes a one-click ```suggestion block.
          jq '[(.findings // [])[:15][] | select((.path | type) == "string" and (.line | type) == "number")
                | {path, line, side: "RIGHT", body: (.body + (if (.suggestion // "") != ""
                    then "\n\n```suggestion\n" + .suggestion + "\n```" else "" end))}
                  + (if (.start_line // 0) > 0 and .start_line < .line
                     then {start_line: .start_line, start_side: "RIGHT"} else {} end)]' \
            .review/output.json > .review/comments.json
          # Everything that leaves this job, checked at once: the summary and every comment.
          { cat .review/summary.md; jq -r '.[].body' .review/comments.json; } > .review/outgoing.txt
          for s in "$OAUTH" "$GH_TOKEN"; do
            [ -n "$s" ] || continue
            b=$(printf '%s' "$s" | base64 -w0)
            if grep -qF -e "$s" -e "${b%%=*}" .review/outgoing.txt; then
              echo "::error::The review holds a secret; nothing posted."; exit 1
            fi
          done
          if grep -Eq 'sk-ant-[A-Za-z0-9_-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|eyJ[A-Za-z0-9_-]{20,}\.' .review/outgoing.txt; then
            echo "::error::The review looks like it holds a token; nothing posted."; exit 1
          fi
          # A finding already posted word for word on the same file (an earlier push) is not posted again.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | {path, body}' | jq -s . > .review/old.json
          jq --slurpfile old .review/old.json '[.[] | . as $c | select(any($old[0][]; .path == $c.path and .body == $c.body) | not)]' \
            .review/comments.json > .review/new.json
          posted=0
          unplaced=""
          if [ "$(jq length .review/new.json)" -gt 0 ]; then
            # One review holding every comment. GitHub refuses the whole review if one line is outside the diff,
            # so on a refusal each comment is tried alone and the ones it refuses go into the summary instead.
            if jq -n --arg sha "$SHA" --slurpfile c .review/new.json \
                 '{commit_id: $sha, event: "COMMENT", body: "", comments: $c[0]}' \
               | gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --input - > /dev/null 2>&1; then
              posted=$(jq length .review/new.json)
            else
              for i in $(seq 0 $(( $(jq length .review/new.json) - 1 ))); do
                if jq --arg sha "$SHA" ".[$i] + {commit_id: \$sha}" .review/new.json \
                   | gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --input - > /dev/null 2>&1; then
                  posted=$((posted + 1))
                else
                  unplaced="$unplaced$(jq -r ".[$i] | \"\n- \`\" + .path + \":\" + (.line | tostring) + \"\`: \" + .body" .review/new.json)"
                fi
              done
            fi
          fi
          {
            echo "<!-- claude-review -->"
            echo "<!-- claude-review: $verdict $SHA -->"
            if [ "$verdict" = pass ]; then
              echo "**Claude review: pass.**"
            else
              echo "**Claude review: problems found. Suggested fixes are on their lines; apply them with \"Commit suggestion\".**"
            fi
            echo
            cat .review/summary.md
            if [ -n "$unplaced" ]; then
              echo
              echo "**Findings that could not be placed on a line:**"
              printf '%s\n' "$unplaced"
            fi
          } > .review/review.md
          # One summary comment per PR, edited on each run, so the thread does not fill with old reviews.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-review -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@.review/review.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file .review/review.md
          fi
          echo "Posted $posted inline comments."
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Pass or fail the check
        if: always() && steps.pr.outputs.mode == 'review'
        env:
          POSTED: ${{ steps.post.outcome }}
          VERDICT: ${{ steps.post.outputs.verdict }}
        run: |
          [ "$POSTED" = success ] || { echo "::error::The review did not finish or gave no result."; exit 1; }
          [ "$VERDICT" = pass ] || { echo "::error::Claude found problems; see the suggestions on the PR."; exit 1; }
