name: Claude Review

# Every pull request gets a check named claude-review, which branch protection on main waits for.
#
# A PR from a branch of this repo (only people with write access can push one) gets the full treatment: Claude
# reviews the whole change against .github/claude-review.md, fixes what it finds, and the fixes are pushed back
# to the PR branch with the Claude app's token, so CI and this review run again on them. After three rounds of
# fixes it only reports. The check fails while real problems remain.
#
# A PR from a fork, or a branch the issue workflow made from someone else's issue (claude/outside-*), is not
# reviewed here: claude-tldr.yml summarises it and it merges only on the owner's word. The check passes so the
# owner can still have it merged. Dependabot PRs pass too; CI covers them.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Decide whether this PR is ours
        id: who
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          ours=false
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [ "$AUTHOR" != "dependabot[bot]" ]; then
            case "$HEAD_REF" in claude/outside-*) ;; *) ours=true ;; esac
          fi
          echo "ours=$ours" >> "$GITHUB_OUTPUT"
          [ "$ours" = true ] || echo "Not reviewed here: summarised by claude-tldr.yml, merged only on the owner's word."

      - name: Check out the PR branch
        if: steps.who.outputs.ours == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Count earlier fix rounds
        if: steps.who.outputs.ours == 'true'
        id: rounds
        run: |
          git fetch -q origin "$BASE_REF"
          n=$(git log "origin/$BASE_REF..HEAD" --format=%s | grep -c '^fix(review):' || true)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -ge 3 ]; then echo "may_fix=false" >> "$GITHUB_OUTPUT"; else echo "may_fix=true" >> "$GITHUB_OUTPUT"; fi
          git config user.name "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"

      - name: Claude reviews (and fixes)
        if: steps.who.outputs.ours == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request ${{ github.repository }}#${{ env.NUMBER }} (branch ${{ env.HEAD_REF }} into
            ${{ env.BASE_REF }}). First read .github/claude-review.md and follow it.

            See the change with `git diff origin/${{ env.BASE_REF }}...HEAD` (use `--stat` first; on a very large
            change, read the riskiest files fully and sample the rest, and say so). `gh pr view ${{ env.NUMBER }}`
            gives the description. Read surrounding code, not only the diff: a bug is often in what the change
            forgot to update.

            ${{ steps.rounds.outputs.may_fix == 'true' && 'Then FIX every real problem you found: edit the files, and make one commit per fix with git, message "fix(review): <what>". Fix only real problems in this change, not style. Do not push; a later step does. If a fix needs a build to be sure, still make it and say so.' || 'This PR has had three rounds of review fixes already. Do NOT edit or commit anything; only report.' }}

            Then give your result as the structured output:
            - verdict: "pass" if no real problem remains unfixed, otherwise "fail".
            - summary: a short TL;DR for the owner: what the PR does, what you found, what you fixed, what is
              left. Plain words, under 250 words, markdown, file:line where useful.
          claude_args: >-
            --max-turns 120
            --allowedTools "Read,Grep,Glob,${{ steps.rounds.outputs.may_fix == 'true' && 'Edit,Write,Bash(git add:*),Bash(git commit:*),' || '' }}Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'

      - name: Push the fixes (no AI in this step)
        if: steps.who.outputs.ours == 'true' && steps.claude.outcome == 'success'
        id: push
        env:
          TOKEN: ${{ steps.claude.outputs.github_token }}
        run: |
          git fetch -q origin "$HEAD_REF"
          ahead=$(git rev-list --count "origin/$HEAD_REF..HEAD")
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          [ "$ahead" -gt 0 ] || exit 0
          # The app's token, not GITHUB_TOKEN: a push with GITHUB_TOKEN would not start CI or this review again.
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"

      - name: Post the summary (no AI in this step)
        if: steps.who.outputs.ours == 'true' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ fromJSON(steps.claude.outputs.structured_output).verdict }}
          SUMMARY: ${{ fromJSON(steps.claude.outputs.structured_output).summary }}
          AHEAD: ${{ steps.push.outputs.ahead }}
        run: |
          {
            echo "<!-- claude-review -->"
            if [ "${AHEAD:-0}" -gt 0 ]; then
              echo "**Claude review: fixed ${AHEAD} problem(s) and pushed; reviewing again.**"
            elif [ "$VERDICT" = pass ]; then
              echo "**Claude review: pass.**"
            else
              echo "**Claude review: problems remain.**"
            fi
            echo
            printf '%s\n' "$SUMMARY"
          } > /tmp/review.md
          # One comment per PR, edited on each run, so the thread does not fill with old reviews.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- claude-review -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@/tmp/review.md > /dev/null
          else
            gh pr comment "$NUMBER" --body-file /tmp/review.md
          fi

      - name: Pass or fail the check
        if: steps.who.outputs.ours == 'true'
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          VERDICT: ${{ steps.claude.outcome == 'success' && fromJSON(steps.claude.outputs.structured_output).verdict || '' }}
          AHEAD: ${{ steps.push.outputs.ahead }}
        run: |
          [ "$OUTCOME" = success ] || { echo "::error::The review did not finish."; exit 1; }
          # Fixes were pushed: the next run reviews them, and that run's check is the one that counts.
          [ "${AHEAD:-0}" -gt 0 ] && exit 0
          [ "$VERDICT" = pass ] || { echo "::error::Claude found problems that remain; see the PR comment."; exit 1; }
