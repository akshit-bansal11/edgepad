name: Site

# The documentation site is its own gate, on its own trigger. It runs only when the
# site changes or when the protocol fixtures do — the page's frame, action and control
# tables are generated from protocol/*.txt at build time, so a fixture edit can break
# the site without touching a line of it.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'protocol/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'protocol/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # Biome (format, import order, lint) -> ESLint (React, Next) -> tsc.
      # The non-mutating mode, so a branch is never quietly reformatted.
      - name: Quality gate
        working-directory: site
        run: npm run check:ci

      # Must build from inside the repository: lib/protocol.ts reads ../protocol/*.txt.
      - name: Build
        working-directory: site
        run: npm run build

  # Dispatch-only: regenerates site/package-lock.json (no local npm here). Download the
  # artifact with `gh run download <id> -n site-lock` and commit it.
  lock:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Regenerate lock file
        working-directory: site
        run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-lock
          path: site/package-lock.json
