name: Site

# The documentation site is its own gate, on its own trigger. It runs only when the
# site changes or when the protocol fixtures do — the page's frame, action and control
# tables are generated from protocol/*.txt at build time, so a fixture edit can break
# the site without touching a line of it.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'protocol/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'protocol/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # Biome (format, import order, lint) -> ESLint (React, Next) -> tsc.
      # The non-mutating mode, so a branch is never quietly reformatted.
      - name: Quality gate
        working-directory: site
        run: npm run check:ci

      # Must build from inside the repository: lib/protocol.ts reads ../protocol/*.txt.
      - name: Build
        working-directory: site
        run: npm run build
