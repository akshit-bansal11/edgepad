name: CI

# Every `uses:` is pinned to a commit SHA with its tag in a trailing comment, and Dependabot moves the
# SHA the same way it would move a tag. A tag is a moving pointer: whoever controls an action's repository
# can repoint it, and the code it then runs is inside this job. release.yml says how the signing key is
# kept out of reach of all of them.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Avalonia's build tasks report usage to its makers unless told not to. Nothing about this repo's builds
# is theirs to collect.
env:
  AVALONIA_TELEMETRY_OPTOUT: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # The same script as the local gate, in its non-mutating mode.
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only android
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: edgepad-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The shared core on Linux, where the Linux app will run it: catches anything that only passed because
  # Windows was forgiving (path case, file locks, line endings).
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only core

  # The Linux laptop app, on the OS it runs on. Built and tested only; nothing here can reach BlueZ.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only linux
      # Self-contained single file: runs on a laptop with no .NET installed. The native libraries (SkiaSharp,
      # HarfBuzz) are bundled into it and unpacked on first start, so the archive needs no .so beside the binary.
      - name: Publish the app
        run: >
          dotnet publish linux/src/Edgepad.Linux/Edgepad.Linux.csproj -c Release -r linux-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Validate the desktop entry
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate linux/packaging/edgepad.desktop
      - name: Build the archive
        run: sh linux/packaging/pack.sh 0.0.0-dev publish Edgepad-linux-x64.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: edgepad-linux
          path: Edgepad-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only windows
      # Self-contained single file: runs on a laptop with no .NET installed.
      - name: Publish exe
        run: >
          dotnet publish windows/src/Edgepad/Edgepad.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: edgepad-windows
          path: publish/Edgepad.exe
          if-no-files-found: error

  # Produces the packages.lock.json files the locked-mode restore needs. GitHub runs a workflow_dispatch only
  # from the default branch, so this is an ordinary job: download the artifact with `gh run download`, commit
  # the files, push again. Locked mode is switched off on the command line because CI=true would otherwise
  # fail the restore over the very lock files being written.
  lockfiles:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Regenerate the lock files
        shell: pwsh
        run: |
          foreach ($project in 'shared/Edgepad.Core', 'shared/Edgepad.Core.Tests', 'windows/src/Edgepad', 'windows/tests/Edgepad.Tests',
                       'linux/src/Edgepad.Linux', 'linux/tests/Edgepad.Linux.Tests') {
            dotnet restore $project --force-evaluate -p:RestoreLockedMode=false
            if ($LASTEXITCODE -ne 0) { throw "restore of $project failed" }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: edgepad-lockfiles
          path: |
            shared/**/packages.lock.json
            windows/**/packages.lock.json
            linux/**/packages.lock.json
          if-no-files-found: warn

  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only macos
      # Nobody working on this repo from Windows or Linux can run swift format, so a red lint step hands
      # back the fix: what the formatter would have changed, as a patch to apply with `git apply`.
      - name: Write the formatting fix as a patch
        if: failure()
        working-directory: macos
        run: |
          swift format format --in-place --recursive Sources Tests Package.swift
          git diff > "$RUNNER_TEMP/macos-format.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: macos-format-patch
          path: ${{ runner.temp }}/macos-format.patch
          if-no-files-found: ignore
      # A universal menu bar app, ad hoc signed: it runs on an Intel or Apple Silicon Mac once Gatekeeper is told to open it.
      - name: Build the app
        run: bash macos/bundle.sh 0.0.0-dev publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: edgepad-macos
          path: publish/Edgepad-mac.zip
          if-no-files-found: error

  # Renders the app icons (Windows .ico, Mac .icns, Linux tray PNG, site touch icon) from assets/edgepad-light.svg.
  # Nothing is committed from here: download the artifact with `gh run download`, copy the files to the same
  # paths, commit them. macos/bundle.sh and the Linux build fail until they are in the tree, on purpose.
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the renderers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin icoutils icnsutils
      - name: Render the icons
        run: sh scripts/icons.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: edgepad-icons
          path: |
            windows/src/Edgepad/edgepad.ico
            macos/Resources/edgepad.icns
            linux/src/Edgepad.Linux/Assets/edgepad-64.png
            site/app/apple-icon.png
          if-no-files-found: error
