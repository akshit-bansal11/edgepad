name: CI

# Every `uses:` is pinned to a commit SHA with its tag in a trailing comment, and Dependabot moves the
# SHA the same way it would move a tag. A tag is a moving pointer: whoever controls an action's repository
# can repoint it, and the code it then runs is inside this job. release.yml says how the signing key is
# kept out of reach of all of them.

on:
  push:
    branches: [main]
  pull_request:
  # A work branch can be checked without opening a pull request: gh workflow run ci.yml --ref <branch>.
  workflow_dispatch:

permissions:
  contents: read

# Avalonia's build tasks report usage to its makers unless told not to. Nothing about this repo's builds
# is theirs to collect.
env:
  AVALONIA_TELEMETRY_OPTOUT: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The same script as the local gate, in its non-mutating mode.
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only android
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgepad-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The shared core on Linux, where the Linux app will run it: catches anything that only passed because
  # Windows was forgiving (path case, file locks, line endings).
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only core
      # The vectors the Kotlin and Swift ports check themselves against, written by the same code the laptop runs.
      # The main session downloads this artifact and commits it as protocol/link-vectors.txt.
      - name: Link vectors
        env:
          EDGEPAD_LINK_VECTORS_OUT: ${{ runner.temp }}/link-vectors.txt
        run: dotnet test --project shared/Edgepad.Core.Tests -c Release --no-build --filter-class "*LinkVectorsOutput"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgepad-link-vectors
          path: ${{ runner.temp }}/link-vectors.txt
          if-no-files-found: error

  # The Linux laptop app, on the OS it runs on. Built and tested only; nothing here can reach BlueZ.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only linux
      # Self-contained single file: runs on a laptop with no .NET installed. The native libraries (SkiaSharp,
      # HarfBuzz) are bundled into it and unpacked on first start, so the archive needs no .so beside the binary.
      - name: Publish the app
        run: >
          dotnet publish linux/src/Edgepad.Linux/Edgepad.Linux.csproj -c Release -r linux-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Validate the desktop entry
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate linux/packaging/edgepad.desktop
      - name: Build the archive
        run: sh linux/packaging/pack.sh 0.0.0-dev publish Edgepad-linux-x64.tar.gz
      - name: Publish the arm64 app
        run: >
          dotnet publish linux/src/Edgepad.Linux/Edgepad.Linux.csproj -c Release -r linux-arm64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish-arm64
      - name: Build the arm64 archive
        run: sh linux/packaging/pack.sh 0.0.0-dev publish-arm64 Edgepad-linux-arm64.tar.gz linux-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgepad-linux
          path: |
            Edgepad-linux-x64.tar.gz
            Edgepad-linux-arm64.tar.gz
          if-no-files-found: error

  # The same quality gate on an arm64 machine. If the runner label is unavailable to this repo, delete this job: the
  # arm64 archive is still published by the linux job above (OD18).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only linux

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only windows
      # PNGs of the Windows surfaces (windows/tests/Edgepad.Tests/DesignGallery.cs), for comparing with the design spec.
      # Never gates: a runner that cannot draw a window fails this step and nothing else.
      - name: Design gallery
        continue-on-error: true
        # A window that waits for input must fail this step, not hold the whole job to its timeout.
        timeout-minutes: 5
        env:
          EDGEPAD_GALLERY_OUT: ${{ runner.temp }}\gallery
        run: dotnet test --project windows/tests/Edgepad.Tests -c Release --filter-class "*DesignGallery"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgepad-windows-shots
          path: ${{ runner.temp }}\gallery\*.png
          if-no-files-found: warn
      # As the release job does it, so a notices file that cannot be written fails here first.
      - name: Write the licence notices
        shell: bash
        run: |
          sh scripts/notices.sh windows/src/Edgepad/packages.lock.json win-x64 windows/src/Edgepad/THIRD-PARTY-NOTICES.txt
      # Self-contained single file: runs on a laptop with no .NET installed.
      - name: Publish exe
        run: >
          dotnet publish windows/src/Edgepad/Edgepad.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgepad-windows
          path: |
            publish/Edgepad.exe
            windows/src/Edgepad/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  # Produces the packages.lock.json files the locked-mode restore needs. GitHub runs a workflow_dispatch only
  # from the default branch, so this is an ordinary job: download the artifact with `gh run download`, commit
  # the files, push again. Locked mode is switched off on the command line because CI=true would otherwise
  # fail the restore over the very lock files being written.
  lockfiles:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Regenerate the lock files
        shell: pwsh
        run: |
          foreach ($project in 'shared/Edgepad.Core', 'shared/Edgepad.Core.Tests', 'windows/src/Edgepad', 'windows/tests/Edgepad.Tests',
                       'linux/src/Edgepad.Linux', 'linux/tests/Edgepad.Linux.Tests') {
            dotnet restore $project --force-evaluate -p:RestoreLockedMode=false
            if ($LASTEXITCODE -ne 0) { throw "restore of $project failed" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: edgepad-lockfiles
          path: |
            shared/**/packages.lock.json
            windows/**/packages.lock.json
            linux/**/packages.lock.json
          if-no-files-found: warn

  # Screenshots of the design gallery (android/app/src/debug/.../gallery), for comparing a screen with the design
  # spec. Never gates a pull request: a runner without KVM fails here with a readable reason and nothing else.
  android-gallery:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then echo "No /dev/kvm on this runner: the emulator would be too slow, stopping." >&2; exit 1; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start emulator
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          # avdmanager and the emulator disagree on the default AVD folder (XDG vs ~/.android): pin it for both.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" --install "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64"
          echo no | "$sdk/avdmanager" create avd -n gallery -k "system-images;android-34;google_apis;x86_64" -d pixel_5
          nohup "$ANDROID_HOME/emulator/emulator" -avd gallery -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          # Bounded: a crashed emulator must fail here with its log, not sit out the job's timeout.
          timeout 120 "$adb" wait-for-device || { tail -n 60 emulator.log; exit 1; }
          for _ in $(seq 1 120); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && exit 0
            sleep 3
          done
          echo "The emulator did not finish booting in 6 minutes." >&2
          tail -n 60 emulator.log
          exit 1
      - name: Screenshots
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          scripts/gallery.sh .
          adb emu kill
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: edgepad-gallery
          path: shots/
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The lproj folders are generated, not committed: the script checks the resx files, then writes them.
      - name: Generate the Mac strings
        run: pwsh scripts/resx-to-lproj.ps1
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only macos
      # Nobody working on this repo from Windows or Linux can run swift format, so a red lint step hands
      # back the fix: what the formatter would have changed, as a patch to apply with `git apply`.
      - name: Write the formatting fix as a patch
        if: failure()
        working-directory: macos
        run: |
          swift format format --in-place --recursive Sources Tests Package.swift
          git diff > "$RUNNER_TEMP/macos-format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: macos-format-patch
          path: ${{ runner.temp }}/macos-format.patch
          if-no-files-found: ignore
      # A universal menu bar app, ad hoc signed: it runs on an Intel or Apple Silicon Mac once Gatekeeper is told to open it.
      - name: Build the app
        run: bash macos/bundle.sh 0.0.0-dev publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgepad-macos
          path: publish/Edgepad-mac.zip
          if-no-files-found: error

  # The Claude Code / Codex plugin's Node scripts and templates. Plain node:test, no install step. The vendors'
  # own validators (claude plugin validate, Codex's) need their CLIs, which these runners do not have; the
  # release checklist covers them.
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Test the plugin
        shell: bash
        run: node --test plugins/test/*.test.mjs

  # Prints docs/design/design-spec.html to the PDF (Chrome) and the Word file (LibreOffice). Like the icons, nothing
  # is committed from here: download the artifact and commit the two files beside the HTML.
  design-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LibreOffice and Lato
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-lato
      - name: Print the PDF and convert the Word file
        run: |
          mkdir -p out
          google-chrome --headless=new --disable-gpu --allow-file-access-from-files --no-pdf-header-footer \
            --virtual-time-budget=5000 --print-to-pdf=out/edgepad-design-spec.pdf "file://$PWD/docs/design/design-spec.html"
          soffice --headless --infilter="HTML (StarWriter)" --convert-to 'docx:MS Word 2007 XML' --outdir out docs/design/design-spec.html
          mv out/design-spec.docx out/edgepad-design-spec.docx
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgepad-design-spec
          path: out/
          if-no-files-found: error

  # Renders the social preview and the app icons (Windows .ico, Mac .icns, Linux tray PNG, site touch icon) from assets/edgepad-light.svg and edgepad-dark.svg.
  # Nothing is committed from here: download the artifact with `gh run download`, copy the files to the same
  # paths, commit them. macos/bundle.sh and the Linux build fail until they are in the tree, on purpose.
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the renderers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin icoutils icnsutils fonts-lato
      - name: Render the icons
        run: sh scripts/icons.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgepad-icons
          path: |
            windows/src/Edgepad/edgepad.ico
            macos/Resources/edgepad.icns
            linux/src/Edgepad.Linux/Assets/edgepad-64.png
            linux/src/Edgepad.Linux/Assets/edgepad-64-dark.png
            windows/src/Edgepad/Assets/tray-light.ico
            windows/src/Edgepad/Assets/tray-dark.ico
            windows/src/Edgepad/Assets/logos/
            site/app/apple-icon.png
            assets/social-preview.png
            site/public/social-preview.png
            assets/brand/
          if-no-files-found: error

  # The marketing videos, a HyperFrames project at assets/video/ (its README), in three jobs. video-sound makes one
  # narration take per script, the music and the effects; video-render renders the five cuts and the covers side by
  # side from that one take; video makes the web copy, poster, captions and contact sheets. Slow, so they run only when
  # something under assets/video/ changed in the push (or, on a pull request, against its base). A change anywhere
  # else skips the work, and the jobs still pass.
  video-sound:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    env:
      # The HyperFrames CLI, pinned: a render is only reproducible against the version that made it.
      HYPERFRAMES: hyperframes@0.8.193
      HYPERFRAMES_SKIP_SKILLS: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did assets/video change?
        id: changed
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          # A dispatched run (the Claude review's fix rounds) has no "before": compare with where it left main.
          if [ -z "$BEFORE" ] && git cat-file -e origin/main 2>/dev/null; then
            BEFORE=$(git merge-base origin/main HEAD)
          fi
          # No usable "before" (a new branch is all zeros, or the commit is not here): treat as changed.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- assets/video; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: '24'
      # earshot makes the sound effects (assets/video/SOUND.md): the base install only, from GitHub at one commit,
      # because PyPI's `earshot` is another project.
      - name: Install ffmpeg, edge-tts, numpy and earshot
        if: steps.changed.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install edge-tts==7.3.1 numpy==2.5.4 \
            "earshot @ git+https://github.com/Leonxlnx/earshot@7a7f7c5c70d4a763a1eca4b3666af7c77e313f97"
      # A slip in a script would otherwise show up as a blank render many minutes in.
      - name: Check the scripts parse
        if: steps.changed.outputs.changed == 'true'
        working-directory: assets/video
        run: |
          for f in ui/*.js; do node --check "$f"; done
          "$RUNNER_TEMP/venv/bin/python" -m py_compile voice.py music.py sfx.py
          for f in scripts/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"; done
      # One short sentence in the narration's voice and one in the default, so a failed take shows whether the
      # service, the voice or the script is at fault.
      - name: Check the voice service
        if: steps.changed.outputs.changed == 'true'
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/venv/bin/edge-tts" --voice en-US-AndrewMultilingualNeural --text "Edgepad, a test." --write-media "$RUNNER_TEMP/a.mp3" && ls -l "$RUNNER_TEMP/a.mp3" || echo "the narration voice failed"
          "$RUNNER_TEMP/venv/bin/edge-tts" --text "Edgepad, a test." --write-media "$RUNNER_TEMP/b.mp3" && ls -l "$RUNNER_TEMP/b.mp3" || echo "the default voice failed"
      - name: Voice
        if: steps.changed.outputs.changed == 'true'
        run: '"$RUNNER_TEMP/venv/bin/python" assets/video/voice.py demo5 reel5'
      - name: Music
        if: steps.changed.outputs.changed == 'true'
        run: '"$RUNNER_TEMP/venv/bin/python" assets/video/music.py demo5 reel5'
      - name: Sound effects
        if: steps.changed.outputs.changed == 'true'
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          python assets/video/sfx.py demo5 reel5
      # The root's length is read before scripts run, so it is written in here from the take (the render jobs do the same).
      - name: Stamp each cut's length
        if: steps.changed.outputs.changed == 'true'
        working-directory: assets/video
        run: |
          for p in demo5:demo5.html demo5:cuts/demo5-portrait.html reel5:cuts/reel5-landscape.html reel5:cuts/reel5-portrait.html reel5:cuts/reel5-34.html; do
            d=$(node -p "require('./out/${p%%:*}/timing.json').duration")
            sed -i "s/data-composition-id=\"[a-z0-9-]*\"/& data-duration=\"$d\"/" "${p#*:}"
          done
      # Lint gates the render. `check` also audits layout, motion and contrast in a browser; its findings are worth
      # reading in this log, but the phone is a canvas the audits cannot see into, so they do not stop the render.
      - name: Lint the compositions
        if: steps.changed.outputs.changed == 'true'
        working-directory: assets/video
        run: |
          for f in demo5.html cuts/*5*.html; do npx --yes "$HYPERFRAMES" lint "$f"; done
      - name: Check the compositions
        if: steps.changed.outputs.changed == 'true'
        continue-on-error: true
        working-directory: assets/video
        run: npx --yes "$HYPERFRAMES" check
      # The take, the bed and the effects, for the render jobs: every cut is cut from the same narration.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changed.outputs.changed == 'true'
        with:
          name: video-sound
          path: assets/video/out/
          retention-days: 1
          if-no-files-found: error

  # One job per cut, side by side: the long film (demo5) in 16:9 and 9:16, the short one (reel5) in 16:9, 9:16 and
  # 3:4, and the two covers.
  video-render:
    needs: video-sound
    if: needs.video-sound.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cut: [demo5, demo5-portrait, reel5-landscape, reel5-portrait, reel5-34, covers]
    env:
      # The HyperFrames CLI, pinned: a render is only reproducible against the version that made it.
      HYPERFRAMES: hyperframes@0.8.193
      HYPERFRAMES_SKIP_SKILLS: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: video-sound
          path: assets/video/out
      # The root's length is read before scripts run, so it is written in here from the take.
      - name: Stamp each cut's length
        working-directory: assets/video
        run: |
          for p in demo5:demo5.html demo5:cuts/demo5-portrait.html reel5:cuts/reel5-landscape.html reel5:cuts/reel5-portrait.html reel5:cuts/reel5-34.html; do
            d=$(node -p "require('./out/${p%%:*}/timing.json').duration")
            sed -i "s/data-composition-id=\"[a-z0-9-]*\"/& data-duration=\"$d\"/" "${p#*:}"
          done
      # H.264 at 30 fps and 20 Mbit/s: at a low bitrate the canvas text goes soft. A render that wrote its file and
      # then failed while tidying up keeps the file: only a missing output fails the step.
      - name: Render
        working-directory: assets/video
        env:
          CUT: ${{ matrix.cut }}
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/video"
          mkdir -p "$V"
          render() {
            local out="$1"; shift
            if ! npx --yes "$HYPERFRAMES" render "$@" --fps 30 --output "$out"; then
              if [ -s "$out" ] || [ -n "$(find "$out" -name '*.png' 2>/dev/null | head -n 1)" ]; then
                echo "::warning::the render of $out exited non-zero after writing it; kept"
              else
                echo "::error::the render of $out wrote nothing"
                return 1
              fi
            fi
          }
          case "$CUT" in
            demo5) render "$V/demo5.mp4" -c demo5.html --video-bitrate 20M ;;
            covers)
              for id in thumb5-landscape thumb5-portrait; do
                render "$RUNNER_TEMP/frames-$id" -c "cuts/$id.html" --format png-sequence
                cp "$(find "$RUNNER_TEMP/frames-$id" -name '*.png' | sort | head -n 1)" "$V/$id.png"
              done ;;
            *) render "$V/$CUT.mp4" -c "cuts/$CUT.html" --video-bitrate 20M ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: video-cut-${{ matrix.cut }}
          path: ${{ runner.temp }}/video/
          retention-days: 1
          if-no-files-found: error

  video:
    needs: [video-sound, video-render]
    if: needs.video-sound.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: video-sound
          path: assets/video/out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: video-cut-*
          merge-multiple: true
          path: ${{ runner.temp }}/video
      # The web copy is for the site: CRF 23, capped so the cut stays under about 40 MB.
      - name: Web copies, posters and captions
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/video"
          for id in demo5; do
            ffmpeg -y -loglevel error -i "$V/$id.mp4" -c:v libx264 -preset slow -crf 23 -maxrate 1000k -bufsize 2000k \
              -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart "$V/$id-web.mp4"
            size=$(stat -c %s "$V/$id-web.mp4")
            if [ "$size" -gt 41943040 ]; then echo "::warning::$id-web.mp4 is $((size / 1048576)) MB, over 40"; fi
            poster=$(jq -r .poster "assets/video/out/$id/timing.json")
            ffmpeg -y -loglevel error -ss "$poster" -i "$V/$id.mp4" -frames:v 1 -q:v 2 "$V/$id-poster.jpg"
          done
          # A small copy of every cut for sites with an upload limit: CRF 26, capped at 2.5 Mbit/s, the picture size kept.
          for id in demo5 demo5-portrait reel5-landscape reel5-portrait reel5-34; do
            ffmpeg -y -loglevel error -i "$V/$id.mp4" -c:v libx264 -preset medium -crf 26 -maxrate 2500k -bufsize 5000k \
              -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "$V/$id-small.mp4"
          done
          for id in demo5 reel5; do
            cp "assets/video/out/$id/$id.en.vtt" "$V/"
            cp "assets/video/out/$id/timing.json" "$V/$id.timing.json"
            cp "assets/video/out/$id/music.mp3" "$V/$id-music.mp3"
            cp "assets/video/out/$id/sfx.mp3" "$V/$id-sfx.mp3"
          done
          # The balance, for an ear that cannot be in this log: each stem's loudness as written (the page plays the bed
          # at data-volume 0.2, 14 dB under this reading), then each finished mix with its true peak.
          for f in demo5 reel5; do
            for s in voice music sfx; do
              echo "$f $s: $(ffmpeg -hide_banner -i "assets/video/out/$f/$s.mp3" -af ebur128 -f null - 2>&1 | grep -E '^ +I:' | tail -n 1)"
            done
          done
          for id in demo5 demo5-portrait reel5-landscape reel5-portrait reel5-34; do
            echo "$id mix: $(ffmpeg -hide_banner -i "$V/$id.mp4" -vn -af ebur128=peak=true -f null - 2>&1 | grep -E '^ +(I|Peak):' | tail -n 2 | tr -s "[:space:]" " ")"
          done
          # Contact sheets, a frame every two seconds, so a review need not download the renders.
          mkdir -p "$RUNNER_TEMP/sheets"
          for s in demo5:640:360:3x3 demo5-portrait:360:640:5x2 reel5-landscape:640:360:3x3 reel5-portrait:360:640:5x2 reel5-34:384:512:5x2; do
            IFS=: read -r id w h tile <<< "$s"
            ffmpeg -y -loglevel error -i "$V/$id.mp4" -vf "fps=1/2,scale=$w:$h,tile=$tile" -q:v 4 -vsync vfr "$RUNNER_TEMP/sheets/$id-%02d.jpg"
          done
          ls -la "$V"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgepad-video
          path: ${{ runner.temp }}/video/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgepad-video-sheets
          path: ${{ runner.temp }}/sheets/
          if-no-files-found: error

  # The one check branch protection waits for, so adding or renaming a job above never needs a settings change.
  # It fails if any job failed or was cancelled; a job skipped on purpose passes.
  ci-ok:
    if: always()
    needs: [android, core, linux, linux-arm64, windows, lockfiles, android-gallery, macos, plugin, design-doc, icons, video-sound, video-render, video]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A CI job ended $r."; exit 1;; esac
          done
