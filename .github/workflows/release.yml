name: Release

# Push a tag such as v0.1.0 to publish. Both apps pass their quality gates, then a signed APK and a
# self-contained exe are attached to a GitHub Release under stable names, so
# releases/latest/download/Edgepad.apk and .../Edgepad.exe always point at the newest build.
#
# Running this by hand instead builds the same two files from whatever the branch currently holds and
# attaches them to a DRAFT release. A draft is visible only to accounts with push access to the repo, and
# GitHub does not create its git tag until it is published, so nothing about it reaches the public: no tag,
# no entry on the releases page, and releases/latest/download keeps pointing at the last real release.
# That is how a build gets onto the owner's own phone and laptop for testing without announcing a version.
#
# Every `uses:` is pinned to a commit SHA with its tag in a trailing comment, and Dependabot moves the
# SHA the same way it would move a tag. A tag is a moving pointer: whoever controls an action's repository
# can repoint it, and the code it then runs is inside this job. That matters most in release.yml, where the
# signing key is decrypted in the same job as four third-party actions, and the key's only other copies are
# two repository secrets and one folder on the owner's laptop.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      label:
        description: 'Name for the draft build (a run number is appended, so it never collides)'
        default: 'test-build'
        required: false
      version:
        description: 'Version the built apps report'
        default: '1.1.0'
        required: false

permissions:
  contents: read

env:
  # A tagged run is versioned by its tag. A hand-run draft has no tag, and GITHUB_REF_NAME would be the
  # branch: Android would cheerfully ship an app calling itself "main", and MSBuild would fail outright,
  # since -p:Version wants a number. So a draft names itself from the input plus the run number, which
  # also makes two drafts of the same version distinguishable once they are on the phone.
  VERSION: ${{ github.event_name == 'workflow_dispatch' && format('{0}-draft.{1}', inputs.version, github.run_number) || '' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only android
      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EDGEPAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EDGEPAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Run scripts/new-signing-key.ps1 once, then push the tag again."
            exit 1
          fi
          keystore="$RUNNER_TEMP/edgepad-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          password=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          echo "::add-mask::$password"
          # The alias is read from the keystore itself rather than kept as another secret.
          alias=$(keytool -list -keystore "$keystore" -storetype pkcs12 -storepass "$password" \
            | awk -F', ' '/PrivateKeyEntry/ { print $1; exit }')
          if [ -z "$alias" ]; then
            echo "::error::The keystore holds no private key"
            exit 1
          fi
          {
            echo "EDGEPAD_KEYSTORE_PATH=$keystore"
            echo "EDGEPAD_KEYSTORE_PASSWORD=$password"
            echo "EDGEPAD_KEY_ALIAS=$alias"
          } >> "$GITHUB_ENV"
      - name: Build the signed APK
        working-directory: android
        run: >
          ./gradlew --no-daemon assembleRelease
          -PversionName="${VERSION:-${GITHUB_REF_NAME#v}}" -PversionCode="${{ github.run_number }}"
      # An unsigned or wrongly signed APK must fail here, not on the phone.
      - name: Verify the signature
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Edgepad.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs Edgepad.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk
          path: Edgepad.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: windows/global.json
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci -Only windows
      - name: Publish the exe
        shell: pwsh
        run: >
          dotnet publish windows/src/Edgepad/Edgepad.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=$(if ($env:VERSION) { $env:VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }) -o publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exe
          path: publish/Edgepad.exe
          if-no-files-found: error

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout first: it cleans the workspace, and would delete artifacts downloaded before it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      # A tagged run takes that version's section of CHANGELOG.md; a hand-run draft takes Unreleased,
      # because a draft is a build of work in progress and has no section of its own yet.
      - name: Take the notes from the changelog
        env:
          SECTION: ${{ github.event_name == 'workflow_dispatch' && 'Unreleased' || '' }}
        run: |
          section="${SECTION:-${GITHUB_REF_NAME#v}}"
          awk -v v="$section" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $section"
            exit 1
          fi
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/Edgepad.apk dist/Edgepad.exe
          --repo "$GITHUB_REPOSITORY" --title "Edgepad $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      # --draft is what keeps this private, and the run number is what keeps two test builds from
      # colliding on a name: deleting a release is an owner action, so a job must never need one deleted
      # to succeed. --target pins the draft to this commit; the tag is only cut if it is ever published.
      - name: Attach the draft build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.label }}-${{ github.run_number }}
        run: |
          gh release create "$NAME" dist/Edgepad.apk dist/Edgepad.exe --repo "$GITHUB_REPOSITORY" --title "Edgepad $NAME" --notes-file notes.md --draft --target "$GITHUB_SHA"
          {
            echo "Draft build **$NAME**, visible only to accounts with push access to this repo."
            echo
            echo 'Download both files with:'
            echo '```'
            echo "gh release download $NAME --repo $GITHUB_REPOSITORY --dir ."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
