name: Gradle verification metadata

# Generates android/gradle/verification-metadata.xml (SHA-256 of every dependency the Android build resolves)
# and uploads it as an artifact. Nothing is committed from here: review the artifact, and commit it by hand
# after an AGP bump, because every version change needs its hashes regenerated.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The tasks ci.yml's android job runs (scripts/check.ps1 -Ci -Only android, then assembleDebug).
      - name: Write verification metadata
        working-directory: android
        run: >
          ./gradlew --no-daemon --continue --write-verification-metadata sha256
          ktlintCheck lint testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: android/gradle/verification-metadata.xml
          if-no-files-found: error
