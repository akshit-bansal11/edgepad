version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: monthly
  # The site, deployed to Vercel. Its versions are pinned exactly (site/README.md), so Dependabot is what
  # moves them; ESLint and TypeScript are held back on purpose, and that README says why.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
