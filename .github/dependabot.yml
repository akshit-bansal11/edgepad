version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directory: /shared
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directory: /linux
    schedule:
      interval: monthly
  # global.json pins the SDK exactly: each SDK carries its own Microsoft.NET.ILLink.Tasks version, which the
  # lock files record, so an SDK that moved on its own broke locked-mode restore on a commit that had passed
  # (release run 40193265879, 10.0.402 -> 10.0.403). This PR is red until CI's lockfiles job is run and its
  # files are committed onto it.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
  # The site, deployed to Vercel. Its versions are pinned exactly (site/README.md), so Dependabot is what
  # moves them; ESLint and TypeScript are held back on purpose, and that README says why.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
