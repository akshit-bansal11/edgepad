<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Edgepad 4.0: the full demo</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="film.css">
</head>
<body>
<!-- Edgepad 4.0: the full demo. The narration (voice.py) sets the length; the director (ui/film.js) builds the rest. -->
<div id="root" data-composition-id="full" data-start="0" data-width="1920" data-height="1080">
  <canvas id="film-canvas"></canvas>
  <div id="film-text"></div>
  <audio id="voice" src="out/full/voice.mp3" data-start="0" data-track-index="0"></audio>
  <audio id="music" src="out/full/music.mp3" data-start="0" data-track-index="1" data-volume="0.16"></audio>
</div>
<script>window.CUT = { id: 'full', w: 1920, h: 1080, base: '' };</script>
<script src="out/full/timing.js"></script>
<script src="ui/kit.js"></script>
<script src="ui/icons.js"></script>
<script src="ui/surface.js"></script>
<script src="ui/screens.js"></script>
<script src="ui/beats.js"></script>
<script src="ui/film.js"></script>
<script>window.__filmReady.then((tl) => { window.__timelines["full"] = tl; window.__hfForceTimelineRebind?.(); });</script>
</body>
</html>
