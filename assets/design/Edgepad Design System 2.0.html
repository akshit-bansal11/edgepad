document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        const binaryStr = atob(entry.data);

        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>@font-face{font-family:Lato;src:url(\"7a1f0c52-4e11-4b3a-9d2e-1c0a4f5b6e01\") format(\"woff2\");font-weight:400}@font-face{font-family:Lato;src:url(\"7a1f0c52-4e11-4b3a-9d2e-1c0a4f5b6e02\") format(\"woff2\");font-weight:700}@font-face{font-family:Lato;src:url(\"7a1f0c52-4e11-4b3a-9d2e-1c0a4f5b6e03\") format(\"woff2\");font-weight:900}<\u002Fstyle>\n<script src=\"f5644648-580a-46c3-b779-49673123574a\"><\u002Fscript>\n\n<script>// Edgepad shared logic: palettes, settings defaults, and the corner-ruler geometry (port of Perimeter.kt + RulerPainter.kt).\n(function () {\n  const HALF_PI = Math.PI / 2;\n  class Perimeter {\n    constructor(width, height, radius) {\n      this.width = width; this.height = height;\n      const r = Math.max(1, Math.min(radius, Math.min(width, height) / 2));\n      this.radius = r;\n      const top = width - 2 * r, side = height - 2 * r, arc = HALF_PI * r;\n      this.length = 2 * top + 2 * side + 4 * arc;\n      this.cornerMid = [-arc / 2, top + arc / 2, top + arc + side + arc / 2, 2 * top + 2 * arc + side + arc / 2, this.length - arc / 2];\n      const pieces = []; let start = 0;\n      const line = (x, y, ux, uy, len) => { pieces.push({ t: 'l', start, len, x, y, ux, uy }); start += len; };\n      const corner = (cx, cy, from) => { pieces.push({ t: 'a', start, len: arc, cx, cy, r, from }); start += arc; };\n      line(r, 0, 1, 0, top); corner(width - r, r, -HALF_PI);\n      line(width, r, 0, 1, side); corner(width - r, height - r, 0);\n      line(width - r, height, -1, 0, top); corner(r, height - r, HALF_PI);\n      line(0, height - r, 0, -1, side); corner(r, r, Math.PI);\n      this.pieces = pieces;\n    }\n    wrap(s) { return ((s % this.length) + this.length) % this.length; }\n    delta(from, to) { const d = this.wrap(to - from); return d > this.length / 2 ? d - thi 00vh;box-sizing:border-box;font-family:Lato,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#16171A;display:flex;flex-direction:column;gap:56px;max-width:1500px\">\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;align-items:center;gap:14px\"><img src=\"65b3190a-142a-48ae-a471-1b762f7f8b99\" style=\"width:36px;height:36px;border-radius:9px\"><div style=\"font-size:28px;font-weight:900;letter-spacing:-.01em\">Edgepad 2.0 \u00b7 design system<\u002Fdiv><a href=\"Edgepad All Screens 2.0.html\" style=\"font-size:13px;font-weight:700\">\u2190 All screens<\u002Fa><\u002Fdiv>\n<div style=\"font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1.05;max-width:900px\">Calm, rounded, one blue.<\u002Fdiv>\n<div style=\"font-size:17px;line-height:1.55;color:#6B6E76;max-width:820px\">One face, Lato, in three weights. Grouped inset cards on a soft ground, in the manner of iOS. One accent, a blue that is #0068D6 in light and a sky #4DA3FF in dark, kept for what is selected, on, live or the one main action. Dark is a soft near-black with off-white ink, not #000 and #FFF. Sentence case everywhere; no spaced capitals. Every text pair on this page is 4.5:1 or better.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"font-size:13px;font-weight:900;color:#0068D6\">01 \u00b7 Colour<\u002Fdiv>\n<div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n<sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n<div style=\"flex:1;min-width:560px;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;background:{{ t.c.bg }};color:{{ t.c.ink }}\">\n<div style=\"font-size:20px;font-weight:900\">{{ t.name }}<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:10px\">\n<sc-for list=\"{{ t.sw }}\" as=\"s\" hint-placeholder-count=\"11\">\n<div style=\"display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px;background:{{ t.c.card }}\">\n<div style=\"width:44px;height:44px;border-radius:12px;flex:none;background:{{ s.hex }};box-shadow:inset 0 0 0 1px {{ t.c.line }}\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><div style=\"font-size:15px;font-weight:700\">{{ s.token }} <span style=\"font-weight:400;color:{{ t.c.dim }}\">{{ s.hex }}<\u002Fspan><\u002Fdiv><div style=\"font-size:13px;color:{{ t.c.dim }}\">{{ s.use }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.5;color:{{ t.c.dim }}\">{{ t.note }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n<div style=\"flex:1;min-width:400px;border-radius:20px;padding:20px;background:#FFFFFF\"><div style=\"font-size:15px;font-weight:700;margin-bottom:12px\">Surface colour picker \u00b7 14 swatches<\u002Fdiv><div style=\"display:flex;gap:10px;flex-wrap:wrap\"><sc-for list=\"{{ swatches }}\" as=\"s\" hint-placeholder-count=\"14\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:30px;height:30px;border-radius:50%;background:{{ s }};box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)\"><\u002Fdiv><div style=\"font-size:11px;color:#6B6E76\">{{ s }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:400px;border-radius:20px;padding:20px;background:#FFFFFF;font-size:14px;line-height:1.6;color:#6B6E76\"><div style=\"font-size:15px;font-weight:700;color:#16171A;margin-bottom:8px\">Surface<\u002Fdiv>With the theme background, the surface draws in the theme's ink, dim (ink at 55%) and accent: the ruler's live indicator, the play button and an active lock are the accent. With a colour, gradient or image background, or one colour chosen for every control, the ink is white or black by the background's luminance and the accent is that one colour. Pattern #84848C at 15%, 35 dp. Spotify #1ED760, logo only.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"font-size:13px;font-weight:900;color:#0068D6\">02 \u00b7 Type \u00b7 Lato 400, 700, 900<\u002Fdiv>\n<div style=\"border-radius:20px;background:#FFFFFF;padding:8px 24px\">\n<sc-for list=\"{{ type }}\" as=\"ty\" hint-placeholder-count=\"11\">\n<div style=\"display:flex;align-items:baseline;gap:24px;padding:14px 0;border-top:{{ ty.rule }}\">\n<div style=\"width:150px;flex:none;font-size:13px;font-weight:700;color:#6B6E76\">{{ ty.token }}<\u002Fdiv>\n<div style=\"width:190px;flex:none;font-size:13px;color:#6B6E76\">{{ ty.spec }}<\u002Fdiv>\n<div style=\"font-size:{{ ty.size }}px;font-weight:{{ ty.w }};letter-spacing:{{ ty.tr }}em;color:{{ ty.col }}\">{{ ty.sample }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:14px;line-height:1.5;color:#6B6E76;max-width:820px\">Figures are tabular everywhere, so a changing value does not jitter. Sentence case for every label, button and caption; the only capitals are the ones a word already has: laptop names, MAC addresses, key caps and controller buttons.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"font-size:13px;font-weight:900;color:#0068D6\">03 \u00b7 Space, radius, size \u00b7 dp<\u002Fdiv>\n<div style=\"display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start\">\n<div style=\"border-radius:20px;background:#FFFFFF;padding:20px;display:flex;gap:18px;align-items:flex-end\">\n<sc-for list=\"{{ space }}\" as=\"sp\" hint-placeholder-count=\"8\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"background:#0068D6;border-radius:3px;width:{{ sp.v }}px;height:{{ sp.v }}px\"><\u002Fdiv><div style=\"font-size:13px;font-weight:700\">{{ sp.v }}<\u002Fdiv><div style=\"font-size:12px;color:#6B6E76\">{{ sp.n }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"border-radius:20px;background:#FFFFFF;padding:20px;display:flex;gap:18px;align-items:flex-end\">\n<sc-for list=\"{{ radii }}\" as=\"r\" hint-placeholder-count=\"6\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:56px;height:56px;background:#E6F0FC;box-shadow:inset 0 0 0 2px #0068D6;border-radius:{{ r.v }}px\"><\u002Fdiv><div style=\"font-size:13px;font-weight:700\">{{ r.label }}<\u002Fdiv><div style=\"font-size:12px;color:#6B6E76\">{{ r.n }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius:20px;background:#FFFFFF;padding:8px 24px;display:grid;grid-template-columns:repeat(2,1fr);column-gap:40px;max-width:1100px\">\n<sc-for list=\"{{ sizes }}\" as=\"z\" hint-placeholder-count=\"16\"><div style=\"display:flex;padding:11px 0;border-bottom:1px solid #E3E5EA;font-size:14px\"><span style=\"flex:1\">{{ z.n }}<\u002Fspan><span style=\"color:#6B6E76\">{{ z.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"font-size:13px;font-weight:900;color:#0068D6\">04 \u00b7 Components \u00b7 live, both themes<\u002Fdiv>\n<div style=\"display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start\">\n<sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n<div style=\"width:420px;border-radius:24px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;background:{{ t.c.bg }}\">\n<div style=\"display:flex;align-items:center;min-height:44px;position:relative\"><div style=\"display:flex;align-items:center;color:{{ t.c.accent }};font-size:17px;position:relative;z-index:1\"><dc-import name=\"EP Icon\" icon=\"ic_chevron_left\" color=\"{{ t.c.accent }}\" size=\"{{ 26 }}\" hint-size=\"26px,26px\"><\u002Fdc-import>Settings<\u002Fdiv><div style=\"position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:700;color:{{ t.c.ink }}\">Nav bar<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:4px 4px 6px;font-size:32px;font-weight:900;letter-spacing:-.01em;color:{{ t.c.ink }}\">Large title<\u002Fdiv>\n<div style=\"padding:18px 16px 8px;font-size:13px;font-weight:700;color:{{ t.c.dim }}\">Section header<\u002Fdiv>\n<div style=\"background:{{ t.c.card }};border-radius:14px;padding:0 16px;display:flex;flex-direction:column\">\n<div style=\"display:flex;align-items:center;min-height:64px;gap:12px\"><div style=\"width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:{{ t.c.accent }}\"><dc-import name=\"EP Icon\" icon=\"ic_laptop\" color=\"{{ t.c.onAccent }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fdc-import><\u002Fdiv><div style=\"flex:1;display:flex;flex-direction:column;gap:2px\"><div style=\"font-size:16px;font-weight:700;color:{{ t.c.ink }}\">AKSHIT-LOQ<\u002Fdiv><div style=\"font-size:13px;color:{{ t.c.accent }}\">Connected<\u002Fdiv><\u002Fdiv><div style=\"height:32px;padding:0 14px;border-radius:16px;display:flex;align-items:center;font-size:15px;font-weight:700;background:{{ t.c.faint }};color:{{ t.c.danger }}\">Forget<\u002Fdiv><\u002Fdiv>\n<div style=\"height:1px;background:{{ t.c.line }};margin-right:-16px\"><\u002Fdiv>\n<dc-import name=\"EP Toggle\" label=\"Toggle row\" on=\"{{ demo.on }}\" sc-camel-on-change=\"{{ demo.setOn }}\" c=\"{{ t.c }}\" hint-size=\"100%,52px\"><\u002Fdc-import>\n<div style=\"height:1px;background:{{ t.c.line }};margin-right:-16px\"><\u002Fdiv>\n<dc-import name=\"EP Toggle\" label=\"Toggle row, off\" on=\"{{ demo.off }}\" sc-camel-on-change=\"{{ demo.setOff }}\" c=\"{{ t.c }}\" hint-size=\"100%,52px\"><\u002Fdc-import>\n<div style=\"height:1px;background:{{ t.c.line }};margin-right:-16px\"><\u002Fdiv>\n<dc-import name=\"EP Link\" label=\"Link row\" summary=\"Summary\" sc-camel-on-open=\"{{ demo.noop }}\" c=\"{{ t.c }}\" hint-size=\"100%,52px\"><\u002Fdc-import>\n<div style=\"height:1px;background:{{ t.c.line }};margin-right:-16px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px 0\"><div style=\"font-size:16px;color:{{ t.c.ink }}\">Segmented<\u002Fdiv><dc-import name=\"EP Segmented\" options=\"{{ demo.segOpts }}\" selected=\"{{ demo.seg }}\" sc-camel-on-select=\"{{ demo.setSeg }}\" c=\"{{ t.c }}\" hint-size=\"230px,32px\"><\u002Fdc-import><\u002Fdiv>\n<div style=\"height:1px;background:{{ t.c.line }};margin-right:-16px\"><\u002Fdiv>\n<dc-import name=\"EP Slider\" label=\"Slider\" value=\"{{ demo.slVal }}\" steps=\"{{ 20 }}\" step=\"{{ demo.sl }}\" sc-camel-on-change=\"{{ demo.setSl }}\" c=\"{{ t.c }}\" hint-size=\"100%,76px\"><\u002Fdc-import>\n<\u002Fdiv>\n<div style=\"padding:8px 16px 0;font-size:13px;line-height:1.4;color:{{ t.c.dim }}\">A footnote under a card explains what the card does.<\u002Fdiv>\n<div style=\"padding:18px 16px 8px;font-size:13px;font-weight:700;color:{{ t.c.dim }}\">A choice list<\u002Fdiv>\n<div style=\"background:{{ t.c.card }};border-radius:14px;padding:0 16px;display:flex;flex-direction:column\">\n<sc-for list=\"{{ demo.choices }}\" as=\"o\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;min-height:48px;cursor:pointer;border-top:{{ o.rule }};margin-right:-16px;padding-right:16px\"><div style=\"flex:1;font-size:16px;color:{{ t.c.ink }}\">{{ o.name }}<\u002Fdiv><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ t.c.accent }}\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"opacity:{{ o.op }}\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"padding:18px 16px 8px;font-size:13px;font-weight:700;color:{{ t.c.dim }}\">Chips<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;padding:0 4px\"><sc-for list=\"{{ t.chips }}\" as=\"ch\" hint-placeholder-count=\"4\"><div sc-camel-on-click=\"{{ ch.pick }}\" style=\"height:32px;padding:0 14px;border-radius:16px;display:flex;align-items:center;font-size:14px;font-weight:700;cursor:pointer;background:{{ ch.bg }};color:{{ ch.fg }}\">{{ ch.n }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<div style=\"padding:18px 16px 8px;font-size:13px;font-weight:700;color:{{ t.c.dim }}\">Colour<\u002Fdiv>\n<div style=\"background:{{ t.c.card }};border-radius:14px;padding:4px 16px 12px\"><dc-import name=\"EP Color Picker\" label=\"Colour picker\" value=\"{{ demo.col }}\" sc-camel-on-change=\"{{ demo.setCol }}\" c=\"{{ t.c }}\" hint-size=\"100%,96px\"><\u002Fdc-import><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;margin-top:20px\">\n<dc-import name=\"EP Button\" label=\"Filled: the one main action\" kind=\"filled\" c=\"{{ t.c }}\" sc-camel-on-click=\"{{ demo.noop }}\" hint-size=\"100%,50px\"><\u002Fdc-import>\n<dc-import name=\"EP Button\" label=\"Tinted: a strong second\" kind=\"outlined\" c=\"{{ t.c }}\" sc-camel-on-click=\"{{ demo.noop }}\" hint-size=\"100%,50px\"><\u002Fdc-import>\n<dc-import name=\"EP Button\" label=\"Plain: a way out\" kind=\"quiet\" c=\"{{ t.c }}\" sc-camel-on-click=\"{{ demo.noop }}\" hint-size=\"100%,50px\"><\u002Fdc-import>\n<dc-import name=\"EP Button\" label=\"Disabled, 35%\" kind=\"filled\" disabled=\"{{ true }}\" c=\"{{ t.c }}\" hint-size=\"100%,50px\"><\u002Fdc-import>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:center;margin-top:20px\"><div style=\"padding:10px 18px;border-radius:22px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);background:{{ t.c.ink }};color:{{ t.c.bg }}\">Toast: said once, then gone<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"font-size:13px;font-weight:900;color:#0068D6\">05 \u00b7 Icons \u00b7 Lucide, stroke 2, 24 dp box<\u002Fdiv>\n<div style=\"border-radius:20px;background:#FFFFFF;padding:20px;display:flex;gap:10px;flex-wrap:wrap\">\n<sc-for list=\"{{ icons }}\" as=\"ic\" hint-placeholder-count=\"26\"><div style=\"width:112px;height:88px;border-radius:14px;background:#F2F3F7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px\"><dc-import name=\"EP Icon\" icon=\"{{ ic }}\" color=\"#16171A\" size=\"{{ 24 }}\" hint-size=\"24px,24px\"><\u002Fdc-import><div style=\"font-size:11px;color:#6B6E76\">{{ ic }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:14px;color:#6B6E76\">Nav and tray actions are drawn in the accent; everything on the surface is ink or dim until it is live.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"font-size:13px;font-weight:900;color:#0068D6\">06 \u00b7 Signature elements<\u002Fdiv>\n<div style=\"display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start\">\n<div style=\"display:flex;flex-direction:column;gap:12px;width:300px\">\n<div style=\"position:relative;width:300px;height:300px;border-radius:32px;overflow:hidden;background:#0E0F12\">\n<svg width=\"300\" height=\"300\"><sc-for list=\"{{ ruler.lines }}\" as=\"l\" hint-placeholder-count=\"0\"><line x1=\"{{ l.x1 }}\" y1=\"{{ l.y1 }}\" x2=\"{{ l.x2 }}\" y2=\"{{ l.y2 }}\" stroke=\"{{ l.col }}\" stroke-linecap=\"round\" stroke-width=\"{{ l.w }}\" stroke-opacity=\"{{ l.o }}\"><\u002Fline><\u002Fsc-for><\u002Fsvg>\n<div style=\"position:absolute;left:{{ ruler.lx }}px;top:{{ ruler.ly }}px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px\"><div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:rgba(242,243,245,.55)\">VOL<\u002Fdiv><div style=\"font-size:26px;font-weight:900;color:#F2F3F5\">60<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.5;color:#6B6E76\">Corner ruler. Notch 11 dp: minor notches are dots, every fifth a rounded pill 20 dp \u00d7 height; the indicator is a 5 dp accent pill 32 dp \u00d7 height with a soft glow. On a level dial the notches for the amount you have are lit in the accent, so it reads as a bent progress bar; the ends feather over 36 dp. The bend widens with the height (reach + 10 dp), so no mark reaches its centre and none can cross. Value 26, 32 and accent while armed.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;width:300px\">\n<div style=\"width:300px;border-radius:16px;padding:6px;box-sizing:border-box;background:#1B1C20;box-shadow:0 12px 40px rgba(0,0,0,.28)\">\n<sc-for list=\"{{ popupRows }}\" as=\"p\" hint-placeholder-count=\"3\"><div style=\"display:flex;align-items:center;height:44px;padding:0 12px;border-radius:10px;font-size:16px;color:#F2F3F5;background:{{ p.bg }}\"><div style=\"flex:1\">{{ p.n }}<\u002Fdiv><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4DA3FF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"opacity:{{ p.op }}\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fsc-for>\n<div style=\"height:1px;background:#2B2D33;margin:6px 8px\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;height:44px;padding:0 12px;font-size:16px;font-weight:700;color:#4DA3FF\">Edit layout<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.5;color:#6B6E76\">Popup menu. Card fill, 16 dp corners, 6 dp inset, 44 dp rows with 10 dp corners, a check in the accent for the current one, the action row below a separator in the accent.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;width:360px\">\n<div style=\"border-radius:24px;padding:18px;background:#E3E5EA;display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n<div style=\"height:40px;padding:0 16px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,.18)\">Esc<\u002Fdiv>\n<div style=\"height:40px;padding:0 16px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:#0068D6;color:#FFFFFF\">Ctrl<\u002Fdiv>\n<div style=\"width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,.18)\">A<\u002Fdiv>\n<div style=\"width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;background:#FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,.12)\">A<\u002Fdiv>\n<div style=\"width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;background:#0068D6;color:#FFFFFF\">B<\u002Fdiv>\n<div style=\"height:30px;padding:0 18px;border-radius:12px;display:flex;align-items:center;font-size:14px;font-weight:700;background:#FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,.12)\">LB<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.5;color:#6B6E76\">Keys and pad controls. Rounded cards that lift slightly off the board; latched or pressed fills the accent with its on-accent ink.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;width:300px\">\n<div style=\"height:120px;border-radius:24px;background:radial-gradient(120% 90% at 20% 0%,#243349 0%,#12161d 55%,#0b0d11 100%);display:flex;align-items:center;justify-content:center\">\n<div style=\"width:250px;border-radius:18px;padding:12px 16px;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:rgba(27,28,32,.88);box-shadow:0 16px 40px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06);color:#F2F3F5\"><dc-import name=\"EP Icon\" icon=\"ic_sun\" color=\"#4DA3FF\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fdc-import><div style=\"flex:1;display:flex;flex-direction:column;gap:7px\"><div style=\"display:flex;align-items:baseline\"><div style=\"flex:1;font-size:13px;font-weight:700;color:#9A9CA3\">Brightness<\u002Fdiv><div style=\"font-size:18px;font-weight:900\">100<\u002Fdiv><\u002Fdiv><div style=\"height:6px;border-radius:3px;background:#3A3C43;overflow:hidden\"><div style=\"width:100%;height:6px;background:#4DA3FF\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.5;color:#6B6E76\">The laptop's level overlay. Always the dark form, frosted, 18 dp corners, the level bar in the accent; muted drops the bar and says so.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { on: true, off: false, seg: 1, sl: 10, choice: 1, chip: 1, col: '#84848C' };\n  componentDidMount() { if (!window.EP) { const t = setInterval(() => { if (window.EP) { clearInterval(t); this.forceUpdate(); } }, 30); } }\n  renderVals() {\n    const EP = window.EP;\n    if (!EP) return { themes: [], swatches: [], type: [], space: [], radii: [], sizes: [], icons: [], popupRows: [], ruler: { lines: [], lx: 0, ly: 0 }, demo: { choices: [], chips: [], segOpts: [] } };\n    const P = EP.PALETTES;\n    const uses = { bg: 'Ground behind every screen', card: 'Grouped cell, popup, key', ink: 'Text and icons', dim: 'Secondary text, 55% ink on the surface', line: 'Separators inside a card', faint: 'Pressed row, neutral chip, segment track', accent: 'Selected, on, live, the main action', onAccent: 'Text and icons on an accent fill', accentSoft: 'Tinted button, caption pill', off: 'Switch and slider when off', danger: 'Forget, remove' };\n    const sw = (c) => ['bg', 'card', 'ink', 'dim', 'line', 'faint', 'accent', 'onAccent', 'accentSoft', 'off', 'danger'].map(k => ({ token: k, hex: c[k], use: uses[k] }));\n    const themes = [\n      { name: 'Dark', c: P.dark, note: 'Ink on ground 17.3:1 \u00b7 dim on card 6.2:1 \u00b7 accent on card 6.5:1, on ground 7.3:1 \u00b7 on-accent on accent 6.7:1 \u00b7 danger on faint 5.4:1.' },\n      { name: 'Light', c: P.light, note: 'Ink on ground 16.2:1 \u00b7 dim on ground 4.6:1, on card 5.1:1 \u00b7 accent on card 5.3:1, on ground 4.8:1, on its tint 4.6:1 \u00b7 white on accent 5.3:1 \u00b7 danger on faint 4.6:1.' }\n    ].map(t => ({ ...t, sw: sw(t.c), chips: ['Theme', 'Colour', 'Gradient', 'Image'].map((n, i) => ({ n, bg: i === this.state.chip ? t.c.accent : t.c.faint, fg: i === this.state.chip ? t.c.onAccent : t.c.ink, pick: () => this.setState({ chip: i }) })) }));\n    const st = this.state;\n    const per = new EP.Perimeter(300, 300, EP.bend(0.7, 32));\n    const r = EP.ruler(per, 0, { after: 140, before: 140, rulerDp: 60 / 0.375, rulerLen: 100 / 0.375, armed: false, height: 0.7 });\n    const ruler = { ...r, lines: r.lines.map(l => ({ ...l, col: l.role === 'tick' ? '#F2F3F5' : '#4DA3FF' })) };\n    const T = (token, spec, size, w, tr, sample, col) => ({ token, spec, size, w, tr, sample, col: col || '#16171A' });\n    const type = [\n      T('Display', '44 \u00b7 900 \u00b7 \u22120.02 em', 44, 900, -0.02, 'Calm, rounded, one blue.'),\n      T('Large title', '32 \u00b7 900 \u00b7 \u22120.01 em', 32, 900, -0.01, 'Settings'),\n      T('Dial value', '26 \u00b7 armed 32 \u00b7 900', 26, 900, -0.01, '23  100  2:04'),\n      T('Headline', '24 \u00b7 900', 24, 900, -0.01, 'Laptop out of reach.'),\n      T('Nav title', '17 \u00b7 700', 17, 700, 0, 'Corners'),\n      T('Button', '17 \u00b7 700', 17, 700, 0, 'Open controls', '#0068D6'),\n      T('Body', '16 \u00b7 400', 16, 400, 0, 'Reconnect automatically'),\n      T('Value', '15 \u00b7 400 \u00b7 dim', 15, 400, 0, '\u00d71.4 \u00b7 100 dp', '#6B6E76'),\n      T('Section', '13 \u00b7 700 \u00b7 dim', 13, 700, 0, 'Surface', '#6B6E76'),\n      T('Caption', '13 \u00b7 400 \u00b7 dim', 13, 400, 0, 'The remembered laptop connects when Edgepad opens.', '#6B6E76'),\n      T('Dial label', '11 \u00b7 700 \u00b7 0.06 em', 11, 700, 0.06, 'VOL  BRI  ZOOM', '#6B6E76')\n    ].map((t, i) => ({ ...t, rule: i === 0 ? 'none' : '1px solid #E3E5EA' }));\n    return {\n      themes, ruler, swatches: EP.SWATCHES, type,\n      space: [['Hair', 1], ['XS', 4], ['S', 8], ['M', 12], ['L', 16], ['XL', 24], ['XXL', 32], ['XXXL', 48]].map(([n, v]) => ({ n, v })),\n      radii: [['4\u20136', 5, 'Small mark'], ['10', 10, 'Key, tile'], ['14', 14, 'Card, button'], ['16', 16, 'Popup'], ['24', 24, 'Sheet'], ['Pill', 28, 'Chip, toggle']].map(([label, v, n]) => ({ label, v, n })),\n      sizes: [['Page side margin', '16 dp'], ['Card inner padding', '16 dp'], ['Nav bar', '48 dp'], ['Settings row', '52 dp'], ['Device row', '64 dp'], ['Choice row', '48 dp'], ['Button', '50 dp \u00b7 radius 14'], ['Chip', '32 dp \u00b7 pill'], ['Segmented', '32 dp \u00b7 thumb radius 7 \u00b7 equal widths'], ['Switch', '51 \u00d7 31 \u00b7 knob 27'], ['Slider', 'track 4 \u00b7 thumb 28'], ['Icon touch', '40 dp'], ['Section header', '24 above \u00b7 8 below'], ['Landscape column gap', '24 dp'], ['Popup', 'card \u00b7 16 corners \u00b7 6 inset'], ['Surface top buttons', 'five \u00b7 step 48 upright, 56 sideways \u00b7 44 hit, round']].map(([n, v]) => ({ n, v })),\n      icons: ['ic_settings', 'ic_keyboard', 'ic_lock', 'ic_gamepad_2', 'ic_macro', 'ic_bluetooth', 'ic_refresh_cw', 'ic_chevron_left', 'ic_chevron_right', 'ic_sliders_horizontal', 'ic_play', 'ic_pause', 'ic_skip_back', 'ic_skip_forward', 'ic_laptop', 'ic_smartphone', 'ic_file_text', 'ic_book_open', 'ic_power', 'ic_plus', 'ic_minus', 'ic_arrow_up', 'ic_arrow_down', 'ic_x', 'ic_volume_2', 'ic_volume_x', 'ic_sun', 'ic_folder_open'],\n      popupRows: ['Xbox', 'Xbox keys', 'Platformer'].map((n, i) => ({ n, op: i === 0 ? 1 : 0, bg: i === 0 ? 'rgba(77,163,255,.12)' : 'transparent' })),\n      demo: {\n        on: st.on, off: st.off, setOn: (v) => this.setState({ on: v }), setOff: (v) => this.setState({ off: v }),\n        segOpts: ['None', 'Grid', 'Dots', 'Checker'], seg: st.seg, setSeg: (i) => this.setState({ seg: i }),\n        sl: st.sl, slVal: '\u00d7' + (0.5 + st.sl * 0.1).toFixed(1), setSl: (v) => this.setState({ sl: v }),\n        choices: ['Off', 'Volume', 'Brightness'].map((n, i) => ({ name: n, op: i === st.choice ? 1 : 0, rule: i === 0 ? 'none' : '1px solid rgba(128,128,128,.22)', pick: () => this.setState({ choice: i }) })),\n        col: st.col, setCol: (v) => this.setState({ col: v }), noop: () => {}\n      }\n    };\n  }\n}\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>\n"</script>
